
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Remy ♡</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030008;color:white;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#bg{z-index:0}
#fx{z-index:1}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse,transparent 15%,#030008a8 100%)}
#scene{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
.word{position:absolute;opacity:0;transform:scale(.3);font-size:clamp(65px,16vw,145px);font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 8px white,0 0 25px #ff45b5,0 0 65px #ff008c;transition:opacity .65s,transform .65s}
.word.on{opacity:1;transform:scale(1)}
#message{position:absolute;text-align:center;opacity:0;transform:scale(.5);font-size:clamp(21px,5vw,37px);font-family:cursive;font-style:italic;line-height:1.5;color:#fff;text-shadow:0 0 8px white,0 0 22px #ff38ac,0 0 45px #ff008c;transition:opacity 1.5s,transform 1.5s}
#message.on{opacity:1;transform:scale(1)}
#footer{position:fixed;z-index:4;bottom:7%;width:100%;text-align:center;font-size:10px;letter-spacing:4px;color:#ff9bd7;text-shadow:0 0 12px #ff168f}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div class="vignette"></div>
<div id="scene">
  <div class="word" id="number">3</div>
  <div class="word" id="you">YOU</div>
  <div class="word" id="are">ARE</div>
  <div id="message">I Love You<br>Remy ♡</div>
</div>
<div id="footer">MADE WITH LOVE ♡</div>

<script>
const bg=document.getElementById('bg'), b=bg.getContext('2d');
const fx=document.getElementById('fx'), c=fx.getContext('2d');
const num=document.getElementById('number');
const you=document.getElementById('you');
const are=document.getElementById('are');
const msg=document.getElementById('message');
const footer=document.getElementById('footer');

let w,h,drops=[],particles=[],heart=false,start=0;
const chars='01♡LOVEアイウエオ';

function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  w=innerWidth;h=innerHeight;
  [bg,fx].forEach(el=>{
    el.width=w*d;el.height=h*d;
    el.style.width=w+'px';el.style.height=h+'px';
  });
  b.setTransform(d,0,0,d,0,0);
  c.setTransform(d,0,0,d,0,0);
  drops=Array.from({length:Math.ceil(w/16)},()=>Math.random()*-50);
  if(heart)makeHeart();
}
addEventListener('resize',resize);
resize();

function matrix(){
  b.fillStyle='rgba(3,0,8,.13)';
  b.fillRect(0,0,w,h);
  b.font='13px monospace';
  drops.forEach((y,i)=>{
    let ch=chars[Math.floor(Math.random()*chars.length)];
    b.fillStyle=Math.random()>.82?'#ffb5e6':'#e21a8c';
    b.shadowColor='#ff168f';b.shadowBlur=8;
    b.fillText(ch,i*16,y*16);
    drops[i]+=Math.random()*.6+.35;
    if(y*16>h&&Math.random()>.96)drops[i]=0;
  });
  b.shadowBlur=0;
}

function point(t,s){
  return {
    x:16*Math.pow(Math.sin(t),3)*s,
    y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s
  };
}

function makeHeart(){
  particles=[];
  const s=Math.min(w/39,h/34,12);
  const cx=w/2,cy=h/2;
  for(let i=0;i<1050;i++){
    const t=Math.random()*Math.PI*2,p=point(t,s);
    const spread=Math.random()*8;
    particles.push({
      x:Math.random()*w,y:Math.random()*h,
      tx:cx+p.x+(Math.random()-.5)*spread,
      ty:cy+p.y+(Math.random()-.5)*spread,
      r:Math.random()*2+0.6,
      speed:.025+Math.random()*.045,
      phase:Math.random()*6.28,
      color:Math.random()>.32?'#ff3ca9':'#ffd0ec'
    });
  }
}

function drawHeart(t){
  c.clearRect(0,0,w,h);
  if(!heart)return;
  const beat=1+Math.sin(t/240)*.018;
  particles.forEach(p=>{
    p.x+=(p.tx-p.x)*p.speed;
    p.y+=(p.ty-p.y)*p.speed;
    const x=w/2+(p.x-w/2)*beat;
    const y=h/2+(p.y-h/2)*beat;
    const tw=.6+Math.abs(Math.sin(t/350+p.phase));
    c.beginPath();
    c.arc(x,y,p.r*tw,0,Math.PI*2);
    c.fillStyle=p.color;
    c.shadowColor=p.color;c.shadowBlur=10*tw;
    c.fill();
  });
  c.shadowBlur=0;
}

function frame(t){
  matrix();drawHeart(t);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function show(el){el.classList.add('on')}
function hide(el){el.classList.remove('on')}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

async function play(){
  heart=false;particles=[];
  [num,you,are,msg].forEach(hide);
  footer.textContent='A LITTLE SURPRISE ♡';
  b.clearRect(0,0,w,h);

  for(let n=3;n>=1;n--){
    num.textContent=n;show(num);
    await wait(950);hide(num);await wait(180);
  }

  show(you);await wait(1050);hide(you);
  await wait(300);
  show(are);await wait(1050);hide(are);
  await wait(350);

  heart=true;makeHeart();
  footer.textContent='SOMETHING FROM MY HEART ♡';
  await wait(1900);
  show(msg);
  footer.textContent='MADE WITH LOVE ♡';
}
play();
</script>
</body>
</html>
